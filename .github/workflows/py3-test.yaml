name: Tests
on:
  pull_request:
jobs:
  style:
    name: Style checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: style

  unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: unit
          tox_args: -k "not network"
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: unit_report
          path: unit_report.html

  driver:
    name: Driver tests (Python 3.10)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: fast-driver

  driver-next:
    name: Driver tests (Python 3.12)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install python 3.12
        uses: actions/setup-python@v5
        id: pyinst
        with:
          python-version: '3.12'
      - run: "sudo ln -s ${{ steps.pyinst.outputs.python-path }} /usr/local/bin/python3.12"
      - run: "echo $PATH; ls -l /usr/local/bin"
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: fast-driver
          py_version: '3.12'

  windows-unit:
    name: Unit tests (Windows)
    # A safe, read-only, non-release check that the same tests/unit
    # suite the Windows packaging pipeline runs (packaging/windows/
    # build-windows.ps1) actually passes on Windows, on every PR --
    # not only when a Windows release build happens to be dispatched.
    # This is deliberately the *first* place Windows unit-test
    # failures should ever be discovered, not the release workflow.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r test-requirements.txt
          # requirements.txt pins wxPython==4.2.0 on Windows, which has
          # no wheel for Python 3.11+ -- install everything else from
          # it, then wxPython separately, wheel-only, matching
          # run-chirp.ps1 and packaging/windows/build-windows.ps1.
          $filtered = Get-Content requirements.txt |
              Where-Object { $_ -notmatch '^\s*wxPython' }
          $tmpReq = New-TemporaryFile
          $filtered | Set-Content $tmpReq
          python -m pip install -r $tmpReq
          python -m pip install --only-binary=:all: "wxPython>=4.2.1"
      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest tests\unit `
            --ignore=tests\unit\test_linux_desktop.py -q

  matrix:
    name: Create support matrix
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: makesupported
      - name: Archive support matrix
        uses: actions/upload-artifact@v4
        with:
          name: support-matrix
          path: model_support.html
