name: macOS Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref (commit SHA preferred) of the application source to package'
        required: true
        default: '9c38424f5e716c00e4444533a093ca1ba51258af'
      release_version:
        description: 'Version string for bundle metadata and artifact filenames'
        required: true
        default: '1.12.0'
      architectures:
        description: 'Which architecture(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x86_64
          - arm64
          - universal2
      build_dmg:
        description: 'Also build a DMG installer'
        required: true
        type: boolean
        default: true
      enable_signing:
        description: 'Sign the app with the Developer ID certificate (requires secrets)'
        required: true
        type: boolean
        default: false
      enable_notarization:
        description: 'Submit the signed app for Apple notarization (requires signing + secrets)'
        required: true
        type: boolean
        default: false
      enable_release_upload:
        description: 'Attach artifacts to a GitHub release (never the existing appimage-v1.12.0 release)'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to upload to when enable_release_upload is true (must not be appimage-v1.12.0)'
        required: true
        default: 'v1.12.0-macos.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event.inputs.architectures == 'all' || github.event.inputs.architectures == matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: arm64
            runner: macos-14
          - arch: universal2
            runner: macos-14
    env:
      CHIRP_APP_VERSION: ${{ github.event.inputs.release_version }}
      CHIRP_BUNDLE_ID: com.ddavis83864.chirp
      ARTIFACT_BASENAME: CHIRP-${{ github.event.inputs.release_version }}-macOS-${{ matrix.arch }}
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Verify checked-out revision
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked out: $ACTUAL_SHA"
          EXPECTED="${{ github.event.inputs.source_ref }}"
          if [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "$ACTUAL_SHA" != "$EXPECTED" ]; then
              echo "error: checked-out HEAD ($ACTUAL_SHA) does not match requested source_ref ($EXPECTED)" >&2
              exit 1
            fi
            echo "Confirmed: HEAD matches the pinned source_ref exactly."
          else
            echo "warning: source_ref '$EXPECTED' is not a full 40-character commit SHA; resolved to $ACTUAL_SHA. Prefer pinning an exact SHA for reproducible releases." >&2
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Report interpreter architecture
        run: |
          python3 -c "import platform; print('platform.machine():', platform.machine())"
          lipo -info "$(python3 -c 'import sys; print(sys.executable)')" || true

      - name: Install gettext (msgfmt)
        run: brew install gettext && brew link --force gettext

      - name: Build CHIRP.app
        run: ./packaging/macos/build_app.sh "${{ matrix.arch }}"

      - name: Validate bundle
        run: |
          ./packaging/macos/validate_bundle.sh \
            packaging/macos/dist/CHIRP.app \
            --version "${{ github.event.inputs.release_version }}" \
            --bundle-id "$CHIRP_BUNDLE_ID" \
            --arch "${{ matrix.arch }}"

      - name: Best-effort launch smoke test
        run: |
          set -uo pipefail
          mkdir -p packaging/macos/out
          LOG="packaging/macos/out/${ARTIFACT_BASENAME}-launch-smoke-test.log"
          packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp \
            --config-dir "$RUNNER_TEMP/chirp-ci-config" > "$LOG" 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "Process still running 5s after launch (did not immediately crash)."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "::warning::CHIRP process exited within 5s of launch. This can be expected on a CI runner without an interactive GUI login session -- treat as inconclusive, not a failure. Log follows:"
            cat "$LOG" || true
          fi

      - name: Sign app
        if: ${{ github.event.inputs.enable_signing == 'true' }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./packaging/macos/sign.sh packaging/macos/dist/CHIRP.app

      - name: Re-verify signature
        if: ${{ github.event.inputs.enable_signing == 'true' }}
        run: |
          codesign --verify --deep --strict --verbose=4 packaging/macos/dist/CHIRP.app
          spctl --assess --type execute --verbose=4 packaging/macos/dist/CHIRP.app || true

      - name: Create zip
        run: |
          mkdir -p packaging/macos/out
          ditto -c -k --sequesterRsrc --keepParent \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"

      - name: Notarize zip and staple app
        if: ${{ github.event.inputs.enable_notarization == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./packaging/macos/notarize.sh \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip" \
            packaging/macos/dist/CHIRP.app
          # The .app is now stapled; rebuild the zip so the shipped archive
          # carries the stapled ticket too.
          rm -f "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"

      - name: Create DMG
        if: ${{ github.event.inputs.build_dmg == 'true' }}
        run: |
          ./packaging/macos/build_dmg.sh \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            "CHIRP ${{ github.event.inputs.release_version }}"

      - name: Notarize DMG
        if: ${{ github.event.inputs.build_dmg == 'true' && github.event.inputs.enable_notarization == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./packaging/macos/notarize.sh \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg"

      - name: Compute checksums
        run: |
          cd packaging/macos/out
          shasum -a 256 *.zip *.dmg 2>/dev/null > "${ARTIFACT_BASENAME}.sha256.txt" || true
          cat "${ARTIFACT_BASENAME}.sha256.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            packaging/macos/out/*.zip
            packaging/macos/out/*.dmg
            packaging/macos/out/*.sha256.txt

      - name: Attach to release
        if: ${{ github.event.inputs.enable_release_upload == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          if [ "$TAG" = "appimage-v1.12.0" ] || [[ "$TAG" == appimage-v* ]]; then
            echo "error: refusing to upload to an appimage-* release tag." >&2
            exit 1
          fi
          gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "macOS packaging of CHIRP ${{ github.event.inputs.release_version }} (source ${{ github.event.inputs.source_ref }})." \
              --target "${{ github.event.inputs.source_ref }}" \
              || echo "release $TAG already exists, uploading assets to it"
          gh release upload "$TAG" packaging/macos/out/*.zip packaging/macos/out/*.dmg packaging/macos/out/*.sha256.txt --clobber
