name: macOS Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref (commit SHA preferred) of the application source to package'
        required: true
        default: '9c38424f5e716c00e4444533a093ca1ba51258af'
      release_version:
        description: 'Version string for bundle metadata and artifact filenames'
        required: true
        default: '1.12.0'
      architectures:
        description: 'Which architecture(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x86_64
          - arm64
          - universal2
      build_dmg:
        description: 'Also build a DMG installer'
        required: true
        type: boolean
        default: true
      enable_signing:
        description: 'Sign the app with the Developer ID certificate (requires secrets)'
        required: true
        type: boolean
        default: false
      enable_notarization:
        description: 'Submit the signed app for Apple notarization (requires signing + secrets)'
        required: true
        type: boolean
        default: false
      enable_release_upload:
        description: 'Attach artifacts to a GitHub release (never the existing appimage-v1.12.0 release)'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to upload to when enable_release_upload is true (must not be appimage-v1.12.0)'
        required: true
        default: 'v1.12.0-macos.1'

permissions:
  contents: write

jobs:
  compute-matrix:
    name: Compute architecture matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Compute
        id: compute
        env:
          ARCHITECTURES: ${{ github.event.inputs.architectures }}
        run: |
          set -euo pipefail
          case "$ARCHITECTURES" in
            all)
              MATRIX='[{"arch":"x86_64","runner":"macos-15-large"},{"arch":"arm64","runner":"macos-15"},{"arch":"universal2","runner":"macos-15"}]'
              ;;
            x86_64)
              MATRIX='[{"arch":"x86_64","runner":"macos-15-large"}]'
              ;;
            arm64)
              MATRIX='[{"arch":"arm64","runner":"macos-15"}]'
              ;;
            universal2)
              MATRIX='[{"arch":"universal2","runner":"macos-15"}]'
              ;;
            *)
              echo "error: unknown architectures input '$ARCHITECTURES'" >&2
              exit 1
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: compute-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    env:
      CHIRP_APP_VERSION: ${{ github.event.inputs.release_version }}
      CHIRP_BUNDLE_ID: com.ddavis83864.chirp
      ARTIFACT_BASENAME: CHIRP-${{ github.event.inputs.release_version }}-macOS-${{ matrix.arch }}
    steps:
      - name: Checkout packaging infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin application source to source_ref
        run: |
          set -euo pipefail
          BRANCH_SHA="$(git rev-parse HEAD)"
          echo "Packaging infrastructure at: $BRANCH_SHA (${{ github.ref_name }})"

          EXPECTED="${{ github.event.inputs.source_ref }}"
          if [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]; then
            RESOLVED="$EXPECTED"
          else
            RESOLVED="$(git rev-parse "$EXPECTED")"
            echo "::warning::source_ref '$EXPECTED' is not a full 40-character commit SHA; resolved to $RESOLVED. Prefer pinning an exact SHA for reproducible releases."
          fi

          if ! git cat-file -e "${RESOLVED}^{commit}" 2>/dev/null; then
            echo "error: source_ref $RESOLVED was not found in the fetched history of ${{ github.ref_name }}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RESOLVED" "$BRANCH_SHA"; then
            echo "error: source_ref $RESOLVED is not an ancestor of packaging branch ${{ github.ref_name }} ($BRANCH_SHA); refusing to build from a divergent application source." >&2
            exit 1
          fi

          echo "Overlaying application source paths from $RESOLVED (packaging/, docs/, and workflow files stay at the branch tip)..."
          git checkout "$RESOLVED" -- chirp setup.py setup.cfg requirements.txt MANIFEST.in COPYING
          echo "Application source pinned to $RESOLVED."
          git status --short || true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Report interpreter architecture
        run: |
          python3 -c "import platform; print('platform.machine():', platform.machine())"
          lipo -info "$(python3 -c 'import sys; print(sys.executable)')" || true

      - name: Install gettext (msgfmt)
        run: brew install gettext && brew link --force gettext

      - name: Build CHIRP.app
        run: ./packaging/macos/build_app.sh "${{ matrix.arch }}"

      - name: Validate bundle
        run: |
          ./packaging/macos/validate_bundle.sh \
            packaging/macos/dist/CHIRP.app \
            --version "${{ github.event.inputs.release_version }}" \
            --bundle-id "$CHIRP_BUNDLE_ID" \
            --arch "${{ matrix.arch }}"

      - name: Best-effort launch smoke test
        run: |
          set -uo pipefail
          mkdir -p packaging/macos/out
          LOG="packaging/macos/out/${ARTIFACT_BASENAME}-launch-smoke-test.log"
          packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp \
            --config-dir "$RUNNER_TEMP/chirp-ci-config" > "$LOG" 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "Process still running 5s after launch (did not immediately crash)."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "CHIRP process exited within 5s of launch. Log follows:"
            cat "$LOG" || true
            # A process can legitimately exit quickly on a CI runner with no
            # interactive GUI login session -- that alone is inconclusive,
            # not a failure. But a Python traceback (missing module, import
            # error, etc.) is unambiguous regardless of GUI availability, so
            # fail the build on those rather than only warning.
            if grep -qE 'Traceback \(most recent call last\)|ModuleNotFoundError|ImportError|\[PYI-[0-9]+:ERROR\]' "$LOG"; then
              echo "::error::CHIRP crashed with a Python exception on launch (see log above), not merely exiting due to lack of a GUI session."
              exit 1
            fi
            echo "::warning::No Python traceback found in the log; early exit is treated as inconclusive on a headless runner, not a failure."
          fi

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}-smoke-test-log
          path: packaging/macos/out/*-launch-smoke-test.log
          if-no-files-found: ignore

      - name: Sign app
        if: ${{ github.event.inputs.enable_signing == 'true' }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./packaging/macos/sign.sh packaging/macos/dist/CHIRP.app

      - name: Re-verify signature
        if: ${{ github.event.inputs.enable_signing == 'true' }}
        run: |
          codesign --verify --deep --strict --verbose=4 packaging/macos/dist/CHIRP.app
          spctl --assess --type execute --verbose=4 packaging/macos/dist/CHIRP.app || true

      - name: Create zip
        run: |
          mkdir -p packaging/macos/out
          ditto -c -k --sequesterRsrc --keepParent \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"

      - name: Notarize zip and staple app
        if: ${{ github.event.inputs.enable_notarization == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./packaging/macos/notarize.sh \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip" \
            packaging/macos/dist/CHIRP.app
          # The .app is now stapled; rebuild the zip so the shipped archive
          # carries the stapled ticket too.
          rm -f "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"

      - name: Create DMG
        if: ${{ github.event.inputs.build_dmg == 'true' }}
        run: |
          ./packaging/macos/build_dmg.sh \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            "CHIRP ${{ github.event.inputs.release_version }}"

      - name: Notarize DMG
        if: ${{ github.event.inputs.build_dmg == 'true' && github.event.inputs.enable_notarization == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./packaging/macos/notarize.sh \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg"

      - name: Compute checksums
        run: |
          cd packaging/macos/out
          shasum -a 256 *.zip *.dmg 2>/dev/null > "${ARTIFACT_BASENAME}.sha256.txt" || true
          cat "${ARTIFACT_BASENAME}.sha256.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            packaging/macos/out/*.zip
            packaging/macos/out/*.dmg
            packaging/macos/out/*.sha256.txt

      - name: Attach to release
        if: ${{ github.event.inputs.enable_release_upload == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          if [ "$TAG" = "appimage-v1.12.0" ] || [[ "$TAG" == appimage-v* ]]; then
            echo "error: refusing to upload to an appimage-* release tag." >&2
            exit 1
          fi
          gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "macOS packaging of CHIRP ${{ github.event.inputs.release_version }} (source ${{ github.event.inputs.source_ref }})." \
              --target "${{ github.event.inputs.source_ref }}" \
              || echo "release $TAG already exists, uploading assets to it"
          gh release upload "$TAG" packaging/macos/out/*.zip packaging/macos/out/*.dmg packaging/macos/out/*.sha256.txt --clobber
