name: macOS Build

# Builds, and -- depending on release_channel -- optionally signs and
# notarizes CHIRP.app for macOS. This workflow never publishes a GitHub
# release -- that is .github/workflows/macos-release.yml's job exclusively,
# which calls this workflow via workflow_call for the build/sign/notarize
# work and then adds environment-gated release publication on top.
#
# release_channel is a first-class, explicit choice, not inferred from
# whether secrets exist:
#   community -- unsigned, not notarized. No Apple credentials needed or
#                touched. This is a fully supported release path, not a
#                fallback.
#   signed    -- Developer ID signed, hardened runtime, notarized, stapled.
#                Requires enable_signing=true, enable_notarization=true,
#                and the six Apple secrets.
# community + enable_signing/enable_notarization=true, or signed +
# either of them false, are both rejected in check-secrets before any
# macOS runner is used.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref (commit SHA preferred) of the application source to package'
        required: true
        default: '9c38424f5e716c00e4444533a093ca1ba51258af'
      release_version:
        description: 'Version string for bundle metadata and artifact filenames'
        required: true
        default: '1.12.0'
      architectures:
        description: 'Comma-separated architectures to build: arm64, x86_64, universal2, or all'
        required: true
        default: 'all'
        type: string
      release_channel:
        description: 'community (unsigned, no Apple credentials) or signed (Developer ID + notarized)'
        required: true
        type: choice
        default: 'community'
        options:
          - community
          - signed
      build_dmg:
        description: 'Also build a DMG installer'
        required: true
        type: boolean
        default: true
      enable_signing:
        description: 'Sign the app and DMG with the Developer ID certificate (requires release_channel=signed and secrets)'
        required: true
        type: boolean
        default: false
      enable_notarization:
        description: 'Submit the signed app and DMG for Apple notarization (requires release_channel=signed, signing, and secrets)'
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_version:
        required: true
        type: string
      architectures:
        required: true
        type: string
      release_channel:
        required: true
        type: string
      build_dmg:
        required: true
        type: boolean
      enable_signing:
        required: true
        type: boolean
      enable_notarization:
        required: true
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  compute-matrix:
    name: Compute architecture matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Compute
        id: compute
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          declare -A SEEN
          ITEMS="[]"
          IFS=',' read -ra ARCHES <<< "$ARCHITECTURES"
          for raw in "${ARCHES[@]}"; do
            arch="$(echo "$raw" | xargs)"
            [ -z "$arch" ] && continue
            case "$arch" in
              all) EXPAND=(x86_64 arm64 universal2) ;;
              x86_64|arm64|universal2) EXPAND=("$arch") ;;
              *) echo "error: unknown architecture '$arch' in '$ARCHITECTURES'" >&2; exit 1 ;;
            esac
            for a in "${EXPAND[@]}"; do
              if [ -z "${SEEN[$a]:-}" ]; then
                SEEN[$a]=1
                case "$a" in
                  x86_64) RUNNER="macos-15-large" ;;
                  arm64|universal2) RUNNER="macos-15" ;;
                esac
                ITEMS="$(echo "$ITEMS" | jq --arg arch "$a" --arg runner "$RUNNER" '. + [{"arch":$arch,"runner":$runner}]')"
              fi
            done
          done
          echo "Resolved matrix: $ITEMS"
          echo "matrix=$(echo "$ITEMS" | jq -c .)" >> "$GITHUB_OUTPUT"

  check-secrets:
    name: Check release-channel guards and signing prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Validate release_channel value
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            community|signed) ;;
            *) echo "::error::release_channel must be 'community' or 'signed' (got '$RELEASE_CHANNEL')." >&2; exit 1 ;;
          esac

      - name: Enforce channel/signing/notarization consistency
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          ENABLE_SIGNING: ${{ inputs.enable_signing }}
          ENABLE_NOTARIZATION: ${{ inputs.enable_notarization }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = "community" ]; then
            if [ "$ENABLE_SIGNING" = "true" ]; then
              echo "::error::release_channel=community requires enable_signing=false. The Community Edition is unsigned by design -- select release_channel=signed if you want to sign." >&2
              exit 1
            fi
            if [ "$ENABLE_NOTARIZATION" = "true" ]; then
              echo "::error::release_channel=community requires enable_notarization=false. The Community Edition is not notarized by design -- select release_channel=signed if you want notarization." >&2
              exit 1
            fi
          elif [ "$RELEASE_CHANNEL" = "signed" ]; then
            if [ "$ENABLE_SIGNING" != "true" ]; then
              echo "::error::release_channel=signed requires enable_signing=true." >&2
              exit 1
            fi
            if [ "$ENABLE_NOTARIZATION" != "true" ]; then
              echo "::error::release_channel=signed requires enable_notarization=true." >&2
              exit 1
            fi
          fi
          if [ "$ENABLE_NOTARIZATION" = "true" ] && [ "$ENABLE_SIGNING" != "true" ]; then
            echo "::error::enable_notarization=true requires enable_signing=true; notarization submits a signed artifact." >&2
            exit 1
          fi
          echo "Channel/signing/notarization combination is consistent."

      - name: Check secret presence (yes/no only -- never expose secret values)
        id: check
        env:
          HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_P12_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_P12" = "true" ] && [ "$HAS_P12_PW" = "true" ] && [ "$HAS_IDENTITY" = "true" ]; then
            echo "signing_secrets_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_secrets_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAS_APPLE_ID" = "true" ] && [ "$HAS_TEAM_ID" = "true" ] && [ "$HAS_APP_PW" = "true" ]; then
            echo "notarization_secrets_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarization_secrets_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail fast if signing/notarization requested without secrets
        env:
          ENABLE_SIGNING: ${{ inputs.enable_signing }}
          ENABLE_NOTARIZATION: ${{ inputs.enable_notarization }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_SIGNING" = "true" ] && [ "${{ steps.check.outputs.signing_secrets_present }}" != "true" ]; then
            echo "::error::enable_signing=true but one or more of MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD / MACOS_SIGNING_IDENTITY is not configured."
            exit 1
          fi
          if [ "$ENABLE_NOTARIZATION" = "true" ] && [ "${{ steps.check.outputs.notarization_secrets_present }}" != "true" ]; then
            echo "::error::enable_notarization=true but one or more of APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD is not configured."
            exit 1
          fi
          echo "Community Edition builds (release_channel=community) never reach this far needing Apple secrets -- enable_signing/enable_notarization are forced false by the guard above, so this check is a no-op for that channel by construction."

  build:
    name: Build (${{ matrix.arch }})
    needs: [compute-matrix, check-secrets]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    env:
      CHIRP_APP_VERSION: ${{ inputs.release_version }}
      CHIRP_BUNDLE_ID: com.ddavis83864.chirp
      ARTIFACT_BASENAME: CHIRP-${{ inputs.release_version }}-macOS-${{ matrix.arch }}${{ inputs.release_channel == 'community' && '-unsigned' || '' }}
    outputs:
      run_id: ${{ github.run_id }}
    steps:
      - name: Checkout packaging infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin application source to source_ref
        run: |
          set -euo pipefail
          BRANCH_SHA="$(git rev-parse HEAD)"
          echo "Packaging infrastructure at: $BRANCH_SHA (${{ github.ref_name }})"

          EXPECTED="${{ inputs.source_ref }}"
          if [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]; then
            RESOLVED="$EXPECTED"
          else
            RESOLVED="$(git rev-parse "$EXPECTED")"
            echo "::warning::source_ref '$EXPECTED' is not a full 40-character commit SHA; resolved to $RESOLVED. Prefer pinning an exact SHA for reproducible releases."
          fi

          if ! git cat-file -e "${RESOLVED}^{commit}" 2>/dev/null; then
            echo "error: source_ref $RESOLVED was not found in the fetched history of ${{ github.ref_name }}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RESOLVED" "$BRANCH_SHA"; then
            echo "error: source_ref $RESOLVED is not an ancestor of packaging branch ${{ github.ref_name }} ($BRANCH_SHA); refusing to build from a divergent application source." >&2
            exit 1
          fi

          echo "Overlaying application source paths from $RESOLVED (packaging/, docs/, and workflow files stay at the branch tip)..."
          git checkout "$RESOLVED" -- chirp setup.py setup.cfg requirements.txt MANIFEST.in COPYING
          echo "APPLICATION_SOURCE_SHA=$RESOLVED" >> "$GITHUB_ENV"
          echo "PACKAGING_BRANCH_SHA=$BRANCH_SHA" >> "$GITHUB_ENV"
          echo "Application source pinned to $RESOLVED."
          git status --short || true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Report interpreter architecture
        run: |
          python3 -c "import platform; print('platform.machine():', platform.machine())"
          lipo -info "$(python3 -c 'import sys; print(sys.executable)')" || true

      - name: Install gettext (msgfmt)
        run: brew install gettext && brew link --force gettext

      - name: Build CHIRP.app
        run: ./packaging/macos/build_app.sh "${{ matrix.arch }}"

      - name: Validate bundle (pre-signing)
        run: |
          ./packaging/macos/validate_bundle.sh \
            packaging/macos/dist/CHIRP.app \
            --version "${{ inputs.release_version }}" \
            --bundle-id "$CHIRP_BUNDLE_ID" \
            --arch "${{ matrix.arch }}" \
            --min-macos "11.0"

      - name: Best-effort launch smoke test (pre-signing)
        run: |
          set -uo pipefail
          mkdir -p packaging/macos/out
          LOG="packaging/macos/out/${ARTIFACT_BASENAME}-launch-smoke-test-presign.log"
          packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp \
            --config-dir "$RUNNER_TEMP/chirp-ci-config-presign" > "$LOG" 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "Process still running 5s after launch (did not immediately crash)."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "CHIRP process exited within 5s of launch. Log follows:"
            cat "$LOG" || true
            if grep -qE 'Traceback \(most recent call last\)|ModuleNotFoundError|ImportError|\[PYI-[0-9]+:ERROR\]' "$LOG"; then
              echo "::error::CHIRP crashed with a Python exception on launch (see log above)."
              exit 1
            fi
            echo "::warning::No Python traceback found in the log; early exit is treated as inconclusive on a headless runner, not a failure."
          fi

      - name: Verify Community Edition bundle is not Developer-ID signed
        if: ${{ inputs.release_channel == 'community' }}
        run: |
          set -euo pipefail
          echo "== codesign -dv on unsigned Community Edition build =="
          SIG_INFO="$(codesign -dv --verbose=4 packaging/macos/dist/CHIRP.app 2>&1)" || true
          echo "$SIG_INFO"
          if echo "$SIG_INFO" | grep -q '^Authority='; then
            echo "::error::Community Edition build unexpectedly carries a real signing authority. release_channel=community must never ship a Developer-ID-signed artifact under the unsigned artifact name. Aborting." >&2
            exit 1
          fi
          echo "Confirmed: no Authority= line present -- unsigned or ad-hoc only (PyInstaller applies its own ad-hoc signature so Apple Silicon binaries can execute at all; this is not a Developer ID signature and is expected)."

      - name: Sign app
        if: ${{ inputs.enable_signing == true }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          mkdir -p packaging/macos/out
          ./packaging/macos/sign.sh \
            packaging/macos/dist/CHIRP.app \
            packaging/macos/out/${{ env.ARTIFACT_BASENAME }}-signing-info.json

      - name: Validate bundle (post-signing)
        if: ${{ inputs.enable_signing == true }}
        run: |
          ./packaging/macos/validate_bundle.sh \
            packaging/macos/dist/CHIRP.app \
            --version "${{ inputs.release_version }}" \
            --bundle-id "$CHIRP_BUNDLE_ID" \
            --arch "${{ matrix.arch }}" \
            --min-macos "11.0"

      - name: Best-effort launch smoke test (post-signing)
        if: ${{ inputs.enable_signing == true }}
        run: |
          set -uo pipefail
          mkdir -p packaging/macos/out
          LOG="packaging/macos/out/${ARTIFACT_BASENAME}-launch-smoke-test-postsign.log"
          packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp \
            --config-dir "$RUNNER_TEMP/chirp-ci-config-postsign" > "$LOG" 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "Signed process still running 5s after launch (did not immediately crash)."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "Signed CHIRP process exited within 5s of launch. Log follows:"
            cat "$LOG" || true
            echo "::error::Signed build crashed or exited immediately -- this is a hardened-runtime/entitlements/signature problem, not a headless-runner limitation, since the unsigned build already passed this same check."
            exit 1
          fi

      - name: Notarize app and staple ticket
        if: ${{ inputs.enable_signing == true && inputs.enable_notarization == true }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p packaging/macos/out
          SUBMIT_ZIP="$RUNNER_TEMP/${ARTIFACT_BASENAME}-app-submission.zip"
          ditto -c -k --keepParent packaging/macos/dist/CHIRP.app "$SUBMIT_ZIP"
          ./packaging/macos/notarize.sh \
            "$SUBMIT_ZIP" \
            packaging/macos/dist/CHIRP.app \
            app \
            packaging/macos/out

      - name: Create zip
        run: |
          mkdir -p packaging/macos/out
          rm -f "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.app.zip"

      - name: Create DMG
        if: ${{ inputs.build_dmg == true }}
        run: |
          VOLNAME="CHIRP ${{ inputs.release_version }}"
          if [ "${{ inputs.release_channel }}" = "community" ]; then
            VOLNAME="CHIRP ${{ inputs.release_version }} (Unsigned Community Edition)"
          fi
          ./packaging/macos/build_dmg.sh \
            packaging/macos/dist/CHIRP.app \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            "$VOLNAME"

      - name: Sign DMG
        if: ${{ inputs.build_dmg == true && inputs.enable_signing == true }}
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          ./packaging/macos/sign_dmg.sh "packaging/macos/out/${ARTIFACT_BASENAME}.dmg"

      - name: Notarize DMG and staple ticket
        if: ${{ inputs.build_dmg == true && inputs.enable_signing == true && inputs.enable_notarization == true }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./packaging/macos/notarize.sh \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            "packaging/macos/out/${ARTIFACT_BASENAME}.dmg" \
            dmg \
            packaging/macos/out

      - name: Post-signing architecture and resource revalidation
        if: ${{ inputs.enable_signing == true }}
        run: |
          set -euo pipefail
          echo "== Re-inspecting signed executable =="
          file packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp
          lipo -info packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp || true
          otool -hv packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp
          echo "== Confirming wx._xml survived signing =="
          XML_MATCHES=$(find packaging/macos/dist/CHIRP.app -iname "_xml*" -path "*/wx/*")
          if [ -z "$XML_MATCHES" ]; then
            echo "::error::wx._xml not found after signing" >&2
            exit 1
          fi
          echo "$XML_MATCHES"
          echo "== Confirming translations/stock configs still present after signing =="
          MO_COUNT=$(find packaging/macos/dist/CHIRP.app -iname "*.mo" | wc -l | tr -d ' ')
          CSV_COUNT=$(find packaging/macos/dist/CHIRP.app -ipath "*stock_configs*.csv" | wc -l | tr -d ' ')
          echo "mo files: $MO_COUNT, stock config csvs: $CSV_COUNT"
          [ "$MO_COUNT" -ge 10 ] || { echo "::error::translations missing after signing"; exit 1; }
          [ "$CSV_COUNT" -ge 10 ] || { echo "::error::stock configs missing after signing"; exit 1; }

      - name: Post-build architecture and resource revalidation (Community Edition)
        if: ${{ inputs.release_channel == 'community' }}
        run: |
          set -euo pipefail
          echo "== Re-inspecting unsigned executable =="
          file packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp
          lipo -info packaging/macos/dist/CHIRP.app/Contents/MacOS/chirp || true
          echo "== Confirming wx._xml present =="
          XML_MATCHES=$(find packaging/macos/dist/CHIRP.app -iname "_xml*" -path "*/wx/*")
          [ -n "$XML_MATCHES" ] || { echo "::error::wx._xml not found"; exit 1; }
          echo "$XML_MATCHES"
          echo "== Confirming translations/stock configs present =="
          MO_COUNT=$(find packaging/macos/dist/CHIRP.app -iname "*.mo" | wc -l | tr -d ' ')
          CSV_COUNT=$(find packaging/macos/dist/CHIRP.app -ipath "*stock_configs*.csv" | wc -l | tr -d ' ')
          echo "mo files: $MO_COUNT, stock config csvs: $CSV_COUNT"
          [ "$MO_COUNT" -ge 10 ] || { echo "::error::translations missing"; exit 1; }
          [ "$CSV_COUNT" -ge 10 ] || { echo "::error::stock configs missing"; exit 1; }
          echo "== Confirming no cross-architecture contamination =="
          BAD=$(find packaging/macos/dist/CHIRP.app -type f \( -name "*.so" -o -name "*.dylib" \) -exec file {} \; | grep -v "${{ matrix.arch }}" | grep -i "mach-o" || true)
          if [ -n "$BAD" ]; then
            echo "::error::found native binaries not matching ${{ matrix.arch }}:"
            echo "$BAD"
            exit 1
          fi
          echo "All native binaries confirmed ${{ matrix.arch }}-only."

      - name: Compute checksums
        run: |
          cd packaging/macos/out
          shasum -a 256 *.zip *.dmg 2>/dev/null > "${ARTIFACT_BASENAME}.sha256.txt" || true
          cat "${ARTIFACT_BASENAME}.sha256.txt"

      - name: Generate provenance manifest
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "packaging/macos/out/${ARTIFACT_BASENAME}-manifest.json" "$BUILD_TIMESTAMP" <<'PYEOF'
          import json
          import os
          import sys

          out_path, build_timestamp = sys.argv[1:3]
          out_dir = os.path.dirname(out_path)
          basename = os.environ["ARTIFACT_BASENAME"]

          signing_info_path = os.path.join(out_dir, f"{basename}-signing-info.json")
          signing_info = {}
          if os.path.exists(signing_info_path):
              with open(signing_info_path) as f:
                  signing_info = json.load(f)

          signed = os.environ["ENABLE_SIGNING"] == "true"
          notarized = os.environ["ENABLE_NOTARIZATION"] == "true"

          artifacts = []
          for ext in (".app.zip", ".dmg"):
              path = os.path.join(out_dir, basename + ext)
              if os.path.exists(path):
                  checksum = ""
                  sha_file = os.path.join(out_dir, basename + ".sha256.txt")
                  if os.path.exists(sha_file):
                      with open(sha_file) as f:
                          for line in f:
                              if line.strip().endswith(os.path.basename(path)):
                                  checksum = line.split()[0]
                                  break
                  artifacts.append({
                      "filename": os.path.basename(path),
                      "size": os.path.getsize(path),
                      "sha256": checksum,
                  })

          manifest = {
              "release_channel": os.environ["RELEASE_CHANNEL"],
              "signed": signed,
              "notarized": notarized,
              "stapled": notarized,
              "gatekeeper_assessed": notarized,
              "developer_id_signed": signed,
              "source_sha": os.environ.get("APPLICATION_SOURCE_SHA", ""),
              "packaging_sha": os.environ.get("PACKAGING_BRANCH_SHA", ""),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "architecture": os.environ["MATRIX_ARCH"],
              "application_version": os.environ["CHIRP_APP_VERSION"],
              "bundle_identifier": os.environ["CHIRP_BUNDLE_ID"],
              "minimum_macos_version": "11.0",
              "artifacts": artifacts,
              "build_timestamp": build_timestamp,
              "signing_authority": signing_info.get("authority", ""),
              "apple_team_id": signing_info.get("team_id", ""),
              "hardened_runtime": signing_info.get("hardened_runtime", False),
          }
          with open(out_path, "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          ENABLE_SIGNING: ${{ inputs.enable_signing }}
          ENABLE_NOTARIZATION: ${{ inputs.enable_notarization }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            packaging/macos/out/*.zip
            packaging/macos/out/*.dmg
            packaging/macos/out/*.sha256.txt
            packaging/macos/out/*-manifest.json
            packaging/macos/out/*-signing-info.json
            packaging/macos/out/*-launch-smoke-test-*.log
            packaging/macos/out/notarization-log-*.json
          if-no-files-found: warn
